name: finance

x-app-env: &app-env
  MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/finance?authSource=admin
  TZ: Asia/Dhaka

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [internal]
    # No ports: MongoDB is reachable only inside the Docker network.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      BOT_INTERNAL_URL: http://bot:8081
    depends_on: { mongo: { condition: service_healthy } }
    networks: [internal]
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"

  bot:
    build: { context: ., target: bot }
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on: { mongo: { condition: service_healthy } }
    networks: [internal]

  mcp:
    build: { context: ., target: mcp }
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on: { mongo: { condition: service_healthy } }
    networks: [internal]
    ports:
      - "127.0.0.1:${MCP_PORT_HOST:-8082}:8082"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web, mcp]
    networks: [internal]

networks:
  internal:

volumes:
  mongo-data:
